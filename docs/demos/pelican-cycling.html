<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <style>
    :root { color-scheme: light; --ink: #283e39; --muted: #7b8275; --paper: #f6f3eb; --accent: #ca674d; }

    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
    .page { width: min(1320px, 100%); margin: auto; padding: 30px 48px 22px; }
    header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 26px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 42px; height: 42px; }
    .brand-name { font-size: 16px; font-weight: 700; letter-spacing: 3px; }
    .brand-en { display: block; margin-top: 4px; font-size: 8px; letter-spacing: 2.8px; font-weight: 500; }
    .edition { display: flex; align-items: center; gap: 15px; font-size: 11px; letter-spacing: 2px; color: var(--muted); }
    .edition span:first-child { padding-right: 15px; border-right: 1px solid #ced0c2; }
    .postcard { position: relative; overflow: hidden; border: 1px solid #dedfd0; border-radius: 12px; background: #edf0df; }
    .intro { position: absolute; z-index: 1; top: 7.3%; left: 5%; pointer-events: none; }
    .eyebrow { display: flex; align-items: center; gap: 10px; color: #647a66; font-size: 10px; font-weight: 600; letter-spacing: 2.5px; }
    .eyebrow::before { content: ""; width: 23px; height: 1px; background: #647a66; }
    h1 { font-family: "Songti SC", "STSong", "SimSun", serif; font-size: clamp(32px, 4.65vw, 64px); font-weight: 500; line-height: 1.35; letter-spacing: 3px; margin: 20px 0 15px; }
    .intro p { margin: 0; color: #748170; font-size: 12px; line-height: 2; letter-spacing: 1.2px; }
    .art { display: block; width: 100%; height: auto; aspect-ratio: 1200 / 650; }
    .scene-label { position: absolute; bottom: 27px; left: 5%; display: flex; align-items: center; gap: 9px; font-size: 10px; color: #687d68; letter-spacing: 1.6px; }
    .scene-label svg { width: 14px; height: 14px; }
    .scene-note { position: absolute; bottom: 27px; right: 4%; font: italic 14px Georgia, serif; color: #87917b; letter-spacing: .5px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 24px; padding: 26px 3px 27px; border-bottom: 1px solid #dce0d2; }
    .caption { display: flex; align-items: center; gap: 17px; }
    .caption-number { color: #aab09e; font: italic 27px Georgia, serif; }
    .caption-title { font-size: 13px; font-weight: 600; letter-spacing: 1px; }
    .caption-text { color: var(--muted); font-size: 10px; letter-spacing: 1px; margin-top: 7px; }
    .controls { display: flex; align-items: center; gap: 22px; }
    .speed-control { display: flex; align-items: center; gap: 12px; }
    .speed-label { color: var(--muted); font-size: 10px; letter-spacing: 1px; }
    .speed-options { display: flex; gap: 3px; padding: 4px; border: 1px solid #d9dfd0; border-radius: 30px; }
    .speed { padding: 7px 11px; min-width: 43px; border: 0; border-radius: 22px; background: transparent; color: #7a8475; font: 11px Georgia, serif; cursor: pointer; transition: background .2s, color .2s; }
    .speed[aria-pressed="true"] { color: #fffef6; background: #3a5547; }
    .speed:hover { background: #e1e6d8; color: var(--ink); }
    .speed[aria-pressed="true"]:hover { background: #3a5547; color: #fffef6; }
    .play { display: flex; align-items: center; justify-content: center; gap: 9px; min-width: 112px; padding: 12px 17px; border: 1px solid #cdd5c7; border-radius: 30px; background: transparent; color: var(--ink); cursor: pointer; font-size: 11px; letter-spacing: 1px; transition: background .2s; }
    .play:hover { background: #e9ecdf; }
    .play svg { width: 14px; height: 14px; }
    footer { display: flex; justify-content: space-between; align-items: center; gap: 15px; padding-top: 20px; font-size: 9px; color: #939a88; letter-spacing: 1.5px; }
    .live { display: flex; gap: 8px; align-items: center; }
    .live::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: #7b9873; }
    body[data-paused="true"] .live::before { background: #c39867; }
    .footer-note { font-family: Georgia, serif; font-size: 11px; letter-spacing: .5px; }
    @media (min-width: 1500px) { .page { padding-top: 45px; } }
    @media (max-width: 760px) {
      .page { padding: 22px 20px 20px; }
      header { padding-bottom: 22px; }
      .brand-name { font-size: 13px; letter-spacing: 2px; }
      .brand-en { font-size: 7px; letter-spacing: 2px; }
      .brand-mark { width: 34px; height: 34px; }
      .edition { font-size: 9px; letter-spacing: 1px; }
      .edition span:first-child { display: none; }
      .postcard { padding-top: 160px; }
      .intro { top: 25px; left: 7%; }
      .eyebrow { font-size: 8px; letter-spacing: 2px; }
      h1 { font-size: 36px; margin: 13px 0 8px; line-height: 1.3; }
      h1 br { display: none; }
      .intro p { font-size: 10px; letter-spacing: .5px; }
      .art { width: 165%; max-width: none; margin-left: -45%; }
      .scene-label { bottom: 20px; left: 7%; font-size: 8px; }
      .scene-note { bottom: 20px; right: 6%; font-size: 11px; }
      .toolbar { flex-direction: column; align-items: stretch; gap: 23px; padding: 24px 2px; }
      .controls { justify-content: space-between; }
      .caption { gap: 13px; }
      .caption-text { line-height: 1.7; }
      footer { font-size: 8px; letter-spacing: .6px; }
      .footer-note { font-size: 9px; }
    }
    @media (prefers-reduced-motion: reduce) { button { transition: none !important; } }
  </style>
</head>

    <section class="toolbar" aria-label="动画播放控制">
      <div class="caption"><span class="caption-number">01</span><div><div class="caption-title">鹈鹕先生的休息日</div><div class="caption-text">目的地不重要，沿途的风刚刚好。</div></div></div>
      <div class="controls">
        <div class="speed-control"><span class="speed-label">骑行速度</span><div class="speed-options" role="group" aria-label="骑行速度">
          <button class="speed" type="button" data-speed="0.5" aria-label="半速骑行" aria-pressed="false">0.5×</button>
          <button class="speed" type="button" data-speed="1" aria-label="正常速度骑行" aria-pressed="true">1×</button>
          <button class="speed" type="button" data-speed="1.5" aria-label="一点五倍速骑行" aria-pressed="false">1.5×</button>
        </div></div>
        <button class="play" id="play-toggle" type="button" aria-label="暂停动画" aria-pressed="false"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path id="play-icon" d="M4 3h3v10H4zM10 3h3v10h-3z"/></svg><span id="play-label">歇一会儿</span></button>
      </div>
    </section>
    <footer><span class="live" id="status" role="status">沿海骑行中</span><span class="footer-note">A small ride. A little joy.</span><span>纯 SVG 绘制 · 循环动画</span></footer>
  </main>
  <script>
    const byId = id => document.getElementById(id);
    const parts = Object.fromEntries([
      'rear-wheel', 'front-wheel', 'crank', 'far-leg', 'far-foot', 'far-pedal',
      'near-leg', 'near-leg-highlight', 'near-foot', 'near-pedal', 'pelican',
      'rider-bike', 'bike-shadow', 'scarf-tail-back', 'scarf-tail-front',
      'water', 'road', 'back-grass', 'foreground', 'clouds', 'gulls', 'open-eye', 'eyelid', 'breeze'
    ].map(id => [id, byId(id)]));
    const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
    let paused = motionPreference.matches;
    let speed = 1;
    let elapsed = 0;
    let previousTime = null;
    let frameId = null;
    const tau = Math.PI * 2;
    const setTransform = (id, value) => parts[id].setAttribute('transform', value);

    function pedalPosition(phase) {
      return { x: 631 + Math.cos(phase) * 29, y: 440 + Math.sin(phase) * 29 };
    }

    function legPath(hip, foot) {
      const ankle = { x: foot.x - 8, y: foot.y - 9 };
      const dx = ankle.x - hip.x;
      const dy = ankle.y - hip.y;
      const distance = Math.hypot(dx, dy);
      const bend = Math.sqrt(82 * 82 - distance * distance / 4);
      const knee = { x: (hip.x + ankle.x) / 2 + dy / distance * bend, y: (hip.y + ankle.y) / 2 - dx / distance * bend };
      return `M${hip.x} ${hip.y}Q${knee.x - 3} ${knee.y - 3} ${knee.x} ${knee.y}T${ankle.x} ${ankle.y}`;
    }

    function draw(time) {
      const phase = time * 3.5;
      const travel = time * 220;
      const bodyBob = Math.sin(phase * 2) * 2;
      const bikeBob = Math.sin(phase * 2 + .6) * .65;
      const near = pedalPosition(phase);
      const far = pedalPosition(phase + Math.PI);
      const nearPath = legPath({ x: 608, y: 315 + bodyBob }, near);
      const farPath = legPath({ x: 601, y: 313 + bodyBob }, far);
      parts['near-leg'].setAttribute('d', nearPath);
      parts['near-leg-highlight'].setAttribute('d', nearPath);
      parts['far-leg'].setAttribute('d', farPath);
      parts['near-foot'].setAttribute('d', `M${near.x - 8} ${near.y - 9}q7 4 12 4l12 3q3 4-2 4h-26q-6-2-3-6Z`);
      parts['far-foot'].setAttribute('d', `M${far.x - 8} ${far.y - 8}q10 10 25 7`);
      setTransform('near-pedal', `translate(${near.x} ${near.y + 4})`);
      setTransform('far-pedal', `translate(${far.x} ${far.y + 4})`);
      setTransform('crank', `translate(631 440) rotate(${phase * 180 / Math.PI - 90})`);
      setTransform('rear-wheel', `rotate(${travel / 79 * 180 / Math.PI})`);
      setTransform('front-wheel', `rotate(${travel / 79 * 180 / Math.PI})`);
      setTransform('pelican', `translate(0 ${bodyBob})`);
      setTransform('rider-bike', `translate(0 ${bikeBob})`);
      parts['bike-shadow'].setAttribute('rx', 224 - bodyBob * 1.2);
      setTransform('scarf-tail-back', `rotate(${Math.sin(time * 6) * 5} 624 208)`);
      setTransform('scarf-tail-front', `rotate(${Math.sin(time * 6 + 1.4) * 7} 624 208)`);
      setTransform('road', `translate(${-travel % 215} 0)`);
      setTransform('water', `translate(${-travel * .13 % 240} 0)`);
      setTransform('foreground', `translate(${-travel % 1200} 0)`);
      setTransform('back-grass', `translate(${-travel * .65 % 1200} 0)`);
      setTransform('clouds', `translate(${Math.sin(time * .08) * 22} 0)`);
      setTransform('gulls', `translate(${Math.sin(time * .3) * 12} ${Math.sin(time * .7) * 3})`);
      const blinking = time % 5.7 > 5.48;
      parts['open-eye'].setAttribute('opacity', blinking ? 0 : 1);
      parts['eyelid'].setAttribute('opacity', blinking ? 1 : 0);
      parts['breeze'].setAttribute('opacity', .3 + (Math.sin(time * 2) + 1) * .15);
    }

    function tick(now) {
      if (previousTime !== null) elapsed += Math.min((now - previousTime) / 1000, .05) * speed;
      previousTime = now;
      draw(elapsed);
      frameId = requestAnimationFrame(tick);
    }

    function syncPlayback() {
      cancelAnimationFrame(frameId);
      previousTime = null;
      const running = !paused && !document.hidden;
      if (running) frameId = requestAnimationFrame(tick);
      document.body.dataset.paused = String(paused);
      byId('play-toggle').setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
      byId('play-toggle').setAttribute('aria-pressed', String(paused));
      byId('play-label').textContent = paused ? '继续兜风' : '歇一会儿';
      byId('play-icon').setAttribute('d', paused ? 'M4 2l10 6-10 6z' : 'M4 3h3v10H4zM10 3h3v10h-3z');
      byId('status').textContent = paused ? '停下来，看看海' : '沿海骑行中';
    }

    byId('play-toggle').addEventListener('click', () => { paused = !paused; syncPlayback(); });
    document.querySelectorAll('.speed').forEach(button => {
      button.addEventListener('click', () => {
        speed = Number(button.dataset.speed);
        document.querySelectorAll('.speed').forEach(option => option.setAttribute('aria-pressed', String(option === button)));
      });
    });
    document.addEventListener('visibilitychange', syncPlayback);
    motionPreference.addEventListener('change', event => { paused = event.matches; syncPlayback(); });
    draw(0);
    syncPlayback();
  </script>
</body>
</html>
