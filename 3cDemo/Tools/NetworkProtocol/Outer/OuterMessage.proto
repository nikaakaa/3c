syntax = "proto3";
package Fantasy.Network.Message;

message FrameSyncVector2
{
    float X = 1;
    float Y = 2;
}

message FrameSyncVector3
{
    float X = 1;
    float Y = 2;
    float Z = 3;
}

message FrameSyncButtonFactMessage
{
    bool Pressed = 1;
    bool Held = 2;
    bool Released = 3;
}

message FrameSyncTargetIntentMessage
{
    uint32 TargetId = 1;
    FrameSyncVector2 AimIntent = 2;
}

message FrameSyncCameraBasisMessage
{
    FrameSyncVector3 PlanarForward = 1;
    FrameSyncVector3 PlanarRight = 2;
    float Yaw = 3;
}

message FrameSyncActionRequestMessage
{
    int32 Kind = 1;
    string StableActionId = 2;
    uint32 RequestSequence = 3;
    FrameSyncButtonFactMessage Button = 4;
    FrameSyncTargetIntentMessage TargetIntent = 5;
}

message FrameSyncInputFrameMessage
{
    int32 Tick = 1;
    uint32 PlayerId = 2;
    uint32 UnitId = 3;
    uint32 LocalInputSequence = 4;
    FrameSyncVector2 MoveIntent = 5;
    int32 MoveIntentSpace = 6;
    FrameSyncVector2 LookIntent = 7;
    int32 LookIntentSpace = 8;
    bool RunHeld = 9;
    FrameSyncButtonFactMessage Dodge = 10;
    FrameSyncButtonFactMessage Attack = 11;
    FrameSyncButtonFactMessage Jump = 12;
    FrameSyncButtonFactMessage Interact = 13;
    repeated FrameSyncActionRequestMessage ActionRequests = 14;
    FrameSyncTargetIntentMessage TargetIntent = 15;
    FrameSyncCameraBasisMessage CameraBasis = 16;
    bool HasCameraBasis = 17;
}

message FrameSyncManifestMessage
{
    uint32 ProtocolVersion = 1;
    uint32 InputSchemaVersion = 2;
    uint32 ChecksumSchemaVersion = 3;
    uint32 BehaviorRuntimeDefinitionHash = 4;
    uint32 LocomotionConfigHash = 5;
    uint32 MotionProfileHash = 7;
    uint32 InputMappingVersion = 8;
}

message C2G_FrameSyncHandshakeRequest // IMessage
{
    uint32 PlayerId = 1;
    uint32 UnitId = 2;
    uint32 ClientSequence = 3;
    uint32 ProtocolVersion = 4;
    uint32 InputSchemaVersion = 5;
    uint32 ChecksumSchemaVersion = 6;
    uint32 BehaviorRuntimeDefinitionHash = 7;
    uint32 LocomotionConfigHash = 8;
    uint32 MotionProfileHash = 10;
    uint32 InputMappingVersion = 11;
}

message G2C_FrameSyncHandshakeResponse // IMessage
{
    uint32 ErrorCode = 1;
    bool Accepted = 2;
    repeated int32 FailureReasons = 3;
    uint32 AssignedPlayerId = 4;
    uint32 AssignedUnitId = 5;
}

message C2G_FrameSyncInput // IMessage
{
    FrameSyncInputFrameMessage Input = 1;
}

message G2C_FrameSyncInputAck // IMessage
{
    int32 Tick = 1;
    uint32 PlayerId = 2;
    uint32 UnitId = 3;
    uint32 LocalInputSequence = 4;
    uint32 ServerSequence = 5;
    bool Accepted = 6;
}

message G2C_FrameSyncConfirmedInputSet // IMessage
{
    int32 Tick = 1;
    uint32 ServerSequence = 2;
    uint32 ProtocolVersion = 3;
    uint32 ConfigHash = 4;
    repeated FrameSyncInputFrameMessage Inputs = 5;
    repeated FrameSyncConfirmedInputDiagnosticMessage Diagnostics = 6;
    int32 ConfirmedTick = 7;
    repeated int32 InputTicks = 8;
    repeated uint32 InputPlayerIds = 9;
    repeated uint32 InputUnitIds = 10;
    repeated uint32 InputLocalInputSequences = 11;
}

message FrameSyncConfirmedInputDiagnosticMessage
{
    int32 Kind = 1;
    int32 Tick = 2;
    uint32 PlayerId = 3;
    uint32 UnitId = 4;
    uint32 LocalInputSequence = 5;
    string Message = 6;
}

message C2G_FrameSyncChecksum // IMessage
{
    int32 Tick = 1;
    uint32 PlayerId = 2;
    uint32 Checksum = 3;
    uint32 SnapshotHash = 4;
}

message G2C_FrameSyncCorrection // IMessage
{
    int32 Tick = 1;
    int32 RestoreTick = 2;
    uint32 ExpectedChecksum = 3;
    uint32 ActualChecksum = 4;
    string Reason = 5;
}

message G2C_FrameSyncDiagnostic // IMessage
{
    int32 Kind = 1;
    int32 Tick = 2;
    uint32 PlayerId = 3;
    uint32 UnitId = 4;
    string DiagnosticMessage = 5;
}

message C2G_FrameSyncReady // IMessage
{
    uint32 PlayerId = 1;
    uint32 UnitId = 2;
}

message C2G_FrameSyncLeave // IMessage
{
    uint32 PlayerId = 1;
    uint32 UnitId = 2;
    string Reason = 3;
}
