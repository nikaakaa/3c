syntax = "proto3";
package Fantasy.Network.Message;

enum ServerAuthoritativeProcessRole
{
    ServerAuthoritativeProcessRoleNone = 0;
    ServerAuthoritativeProcessRoleAuthorityWorker = 1;
    ServerAuthoritativeProcessRoleClientA = 2;
    ServerAuthoritativeProcessRoleClientB = 3;
}

enum ServerAuthoritativeErrorCode
{
    ServerAuthoritativeSuccess = 0;
    ServerAuthoritativeInvalidProtocol = 1;
    ServerAuthoritativeInvalidIdentity = 2;
    ServerAuthoritativeWorkerUnavailable = 3;
    ServerAuthoritativeWorkerAlreadyRegistered = 4;
    ServerAuthoritativeRoomFull = 5;
    ServerAuthoritativeRosterIncomplete = 6;
    ServerAuthoritativeOwnerMismatch = 7;
    ServerAuthoritativeQueueOverflow = 8;
    ServerAuthoritativeSessionClosed = 9;
    ServerAuthoritativeTicketInvalid = 10;
    ServerAuthoritativeTicketExpired = 11;
    ServerAuthoritativeTicketReused = 12;
    ServerAuthoritativeDataPlaneFailed = 13;
    ServerAuthoritativeCheckpointRejected = 14;
}

message ServerAuthoritativeProtocolIdentityMessage
{
    uint32 ModelProtocolVersion = 1;
    string ModelId = 2;
    string ModelConfigurationHash = 3;
    string EndpointId = 4;
}

message ServerAuthoritativeProgramIdentityMessage
{
    string ProgramId = 1;
    string ProgramHash = 2;
    string LayoutHash = 3;
    string OperationSetId = 4;
    string OperationSetVersion = 5;
}

message ServerAuthoritativePipelineIdentityMessage
{
    string PipelineId = 1;
    string PipelineHash = 2;
    string BackendId = 3;
    string SolverId = 4;
    string SolverVersion = 5;
    uint32 TickRate = 6;
    uint64 SolverCapabilities = 7;
    uint64 SolverFeatures = 8;
}

message ServerAuthoritativeAuthorityHostIdentityMessage
{
    string HostProductId = 1;
    string HostId = 2;
    int32 RouteKind = 3;
    string RoomId = 4;
}

message ServerAuthoritativeWorldIdentityMessage
{
    string SolverId = 1;
    string SolverVersion = 2;
    uint64 SolverCapabilities = 3;
    uint64 SolverFeatures = 4;
    string WorldId = 5;
    string MapId = 6;
    string WorldRevision = 7;
    string WorldConfigurationHash = 8;
    string NavigationSurfaceArtifactHash = 9;
    string QueryProfileHash = 10;
}

message ServerAuthoritativeDataEndpointMessage
{
    string Host = 1;
    uint32 Port = 2;
}

message ServerAuthoritativeRosterMemberMessage
{
    string PlayerId = 1;
    string ActorId = 2;
    int32 ProcessRole = 3;
}

message ServerAuthoritativeRosterMessage
{
    string RoomId = 1;
    string SessionId = 2;
    uint64 Revision = 3;
    repeated ServerAuthoritativeRosterMemberMessage Members = 4;
    bool Locked = 5;
    string HostId = 6;
}

message ServerAuthoritativeDataPlaneTicketMessage
{
    string TicketId = 1;
    string RoomId = 2;
    string SessionId = 3;
    string PlayerId = 4;
    string ActorId = 5;
    string HostId = 6;
    ServerAuthoritativeDataEndpointMessage AuthorityEndpoint = 7;
    string Nonce = 8;
    int64 ExpiresAtUnixMilliseconds = 9;
}

message ServerAuthoritativeReliableGameplayEventMessage
{
    string ActorId = 1;
    string EventId = 2;
    uint64 EventSequence = 3;
    uint64 AuthorityTick = 4;
    string EventKind = 5;
    uint32 PayloadSchemaVersion = 6;
    uint32 PayloadLength = 7;
    repeatedArray byte Payload = 8;
}

message W2G_ServerAuthoritativeAuthorityRegisterRequest // IRequest,G2W_ServerAuthoritativeAuthorityRegisterResponse
{
    string RoomId = 1;
    ServerAuthoritativeAuthorityHostIdentityMessage Host = 2;
    int32 ProcessRole = 3;
    ServerAuthoritativeProtocolIdentityMessage Protocol = 4;
    ServerAuthoritativeProgramIdentityMessage Program = 5;
    ServerAuthoritativePipelineIdentityMessage AuthorityPipeline = 6;
    string PredictionPipelineId = 7;
    string PredictionPipelineHash = 8;
    ServerAuthoritativeDataEndpointMessage DataEndpoint = 9;
    ServerAuthoritativeWorldIdentityMessage World = 10;
}

message G2W_ServerAuthoritativeAuthorityRegisterResponse // IResponse
{
    int32 ResultCode = 1;
    uint64 RoomRevision = 2;
    string SessionId = 3;
    string FailureReason = 4;
}

message C2G_ServerAuthoritativeClientJoinRequest // IRequest,G2C_ServerAuthoritativeClientJoinResponse
{
    string RoomId = 1;
    string PlayerId = 2;
    int32 ProcessRole = 3;
    ServerAuthoritativeProtocolIdentityMessage Protocol = 4;
    ServerAuthoritativeProgramIdentityMessage Program = 5;
    string PredictionPipelineId = 6;
    string PredictionPipelineHash = 7;
    ServerAuthoritativeWorldIdentityMessage PredictionWorld = 8;
}

message G2C_ServerAuthoritativeClientJoinResponse // IResponse
{
    int32 ResultCode = 1;
    string SessionId = 2;
    string OwnedActorId = 3;
    ServerAuthoritativeRosterMessage Roster = 4;
    uint64 LatestAuthorityTick = 5;
    string FailureReason = 6;
    ServerAuthoritativeAuthorityHostIdentityMessage AuthorityHost = 7;
    ServerAuthoritativeWorldIdentityMessage AuthorityWorld = 8;
    ServerAuthoritativePipelineIdentityMessage AuthorityPipeline = 9;
}

message C2G_ServerAuthoritativeClientJoinAccepted // IMessage
{
    string RoomId = 1;
    string SessionId = 2;
    string PlayerId = 3;
    string HostId = 4;
}

message G2C_ServerAuthoritativeRosterChanged // IMessage
{
    ServerAuthoritativeRosterMessage Roster = 1;
}

message G2W_ServerAuthoritativeRosterChanged // IMessage
{
    ServerAuthoritativeRosterMessage Roster = 1;
}

message G2C_ServerAuthoritativeDataPlaneTicketIssued // IMessage
{
    ServerAuthoritativeDataPlaneTicketMessage Ticket = 1;
}

message G2W_ServerAuthoritativeDataPlaneTicketIssued // IMessage
{
    ServerAuthoritativeDataPlaneTicketMessage Ticket = 1;
}

message C2G_ServerAuthoritativeDataPlaneTicketConsumed // IMessage
{
    string RoomId = 1;
    string SessionId = 2;
    string PlayerId = 3;
    string TicketId = 4;
}

message W2G_ServerAuthoritativeDataPlaneTicketConsumed // IMessage
{
    string RoomId = 1;
    string SessionId = 2;
    string HostId = 3;
    string PlayerId = 4;
    string TicketId = 5;
}

message G2C_ServerAuthoritativeDataPlaneTicketRevoked // IMessage
{
    string RoomId = 1;
    string SessionId = 2;
    string TicketId = 3;
    string Reason = 4;
}

message G2W_ServerAuthoritativeDataPlaneTicketRevoked // IMessage
{
    string RoomId = 1;
    string SessionId = 2;
    string TicketId = 3;
    string Reason = 4;
}

message C2G_ServerAuthoritativeControlHeartbeat // IMessage
{
    string RoomId = 1;
    string SessionId = 2;
    string PlayerId = 3;
    uint64 Sequence = 4;
    int64 ClientUnixMilliseconds = 5;
}

message G2C_ServerAuthoritativeControlHeartbeatAck // IMessage
{
    string RoomId = 1;
    string SessionId = 2;
    uint64 Sequence = 3;
    int64 ClientUnixMilliseconds = 4;
    int64 ServerUnixMilliseconds = 5;
}

message W2G_ServerAuthoritativeControlHeartbeat // IMessage
{
    string RoomId = 1;
    string SessionId = 2;
    string HostId = 3;
    uint64 Sequence = 4;
    int64 ClientUnixMilliseconds = 5;
}

message G2W_ServerAuthoritativeControlHeartbeatAck // IMessage
{
    string RoomId = 1;
    string SessionId = 2;
    uint64 Sequence = 3;
    int64 ClientUnixMilliseconds = 4;
    int64 ServerUnixMilliseconds = 5;
}

message W2G_ServerAuthoritativeReliableGameplayEventBatch // IMessage
{
    string RoomId = 1;
    string SessionId = 2;
    string RecipientActorId = 3;
    repeated ServerAuthoritativeReliableGameplayEventMessage Events = 4;
}

message G2C_ServerAuthoritativeReliableGameplayEventBatch // IMessage
{
    string RoomId = 1;
    string SessionId = 2;
    repeated ServerAuthoritativeReliableGameplayEventMessage Events = 3;
}

message C2G_ServerAuthoritativeFullCheckpointRequest // IMessage
{
    string RoomId = 1;
    string SessionId = 2;
    string PlayerId = 3;
    string ActorId = 4;
    uint64 LastUsableSnapshotSequence = 5;
    string Reason = 6;
}

message G2W_ServerAuthoritativeFullCheckpointRequest // IMessage
{
    string RoomId = 1;
    string SessionId = 2;
    string PlayerId = 3;
    string ActorId = 4;
    uint64 RequestSequence = 5;
    uint64 LastUsableSnapshotSequence = 6;
    string Reason = 7;
}

message W2G_ServerAuthoritativeFullCheckpointResponse // IMessage
{
    string RoomId = 1;
    string SessionId = 2;
    string PlayerId = 3;
    string ActorId = 4;
    uint64 RequestSequence = 5;
    uint64 AuthorityTick = 6;
    uint64 ConfirmedInputSequence = 7;
    uint64 ReliableEventHorizon = 8;
    string CheckpointLayoutHash = 9;
    string CheckpointHash = 10;
    uint32 CheckpointLength = 11;
    repeatedArray byte Checkpoint = 12;
    uint64 SnapshotSequence = 13;
}

message G2C_ServerAuthoritativeFullCheckpointResponse // IMessage
{
    string RoomId = 1;
    string SessionId = 2;
    string ActorId = 3;
    uint64 AuthorityTick = 4;
    uint64 ConfirmedInputSequence = 5;
    uint64 ReliableEventHorizon = 6;
    string CheckpointLayoutHash = 7;
    string CheckpointHash = 8;
    uint32 CheckpointLength = 9;
    repeatedArray byte Checkpoint = 10;
    uint64 SnapshotSequence = 11;
}

message G2C_ServerAuthoritativeSessionFailed // IMessage
{
    string RoomId = 1;
    string SessionId = 2;
    int32 ResultCode = 3;
    string Reason = 4;
}

message G2W_ServerAuthoritativeSessionFailed // IMessage
{
    string RoomId = 1;
    string SessionId = 2;
    int32 ResultCode = 3;
    string Reason = 4;
}

message C2G_ServerAuthoritativeLeave // IMessage
{
    string RoomId = 1;
    string SessionId = 2;
    string PlayerId = 3;
    string Reason = 4;
}

message W2G_ServerAuthoritativeLeave // IMessage
{
    string RoomId = 1;
    string SessionId = 2;
    string HostId = 3;
    string Reason = 4;
}
