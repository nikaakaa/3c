<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕的海岸骑行</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; background: #f5f1e7; color: #254842; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; display: grid; place-items: center; padding: 28px; }
  main { width: min(1080px, 100%); }
  header { display: flex; justify-content: space-between; align-items: end; padding: 0 6px 24px; gap: 20px; }
  .eyebrow { font-size: 11px; letter-spacing: 3px; font-weight: 700; margin: 0 0 12px; }
  h1 { font-size: clamp(26px, 4vw, 42px); font-weight: 500; letter-spacing: 2px; margin: 0; }
  .issue { font-size: 12px; letter-spacing: 2px; white-space: nowrap; }
  .scene { position: relative; border: 1px solid #25484224; border-radius: 24px; overflow: hidden; background: #e6eee3; }
  svg { display: block; width: 100%; height: auto; }
  .scene-label { position: absolute; top: 26px; left: 30px; font-size: 11px; letter-spacing: 2px; color: #587369; }
  footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 6px 0; }
  .caption { font-size: 13px; color: #738178; line-height: 1.8; margin: 0; }
  .controls { display: flex; gap: 16px; align-items: center; font-size: 12px; }
  button { background: #254842; border: 0; border-radius: 100px; color: #fffdf4; padding: 12px 20px; font: inherit; cursor: pointer; min-width: 88px; }
  button:hover { background: #386157; }
  button:focus-visible, input:focus-visible { outline: 3px solid #e79943; outline-offset: 4px; }
  label { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
  input { accent-color: #37685a; width: 85px; }
  @media(max-width: 600px) { body { padding: 18px; } header { align-items: start; } .issue { display: none; } footer { flex-direction: column; align-items: start; } .scene-label { top: 16px; left: 18px; font-size: 9px; } }
</style>
</head>
<body>
<main>
  <header><div><p class="eyebrow">THE SLOW DAYS CLUB / 慢日子俱乐部</p><h1>兜风去，鹈鹕先生。</h1></div><span class="issue">COASTAL RIDE · Nº 01</span></header>
  <div class="scene">
    <span class="scene-label">海风正好 · 不必赶路</span>
    <svg viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
      <title id="title">鹈鹕骑自行车的二维动画</title>
      <desc id="desc">一只戴绿色帽子、系橙色围巾的白鹈鹕，踩着薄荷绿色自行车沿海岸前进。车轮旋转，双脚交替踩踏，云和路面缓缓后退。</desc>
      <defs>
        <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#e6eee3"/><stop offset="1" stop-color="#f5f1df"/></linearGradient>
        <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#a9cbc0"/><stop offset="1" stop-color="#c9dbcd"/></linearGradient>
        <g id="cloud" fill="#fffdf1"><path d="M0 23 Q-6 5 16 5 Q28-17 48 0 Q65-7 74 12 Q94 10 95 23Z"/></g>
        <g id="wheel" fill="none">
          <circle r="85" stroke="#294b47" stroke-width="12"/>
          <circle r="76" stroke="#eee8cf" stroke-width="5"/>
          <g stroke="#6f9284" stroke-width="2" opacity=".85"><path d="M-73 0H73 M0-73V73 M-52-52L52 52 M-52 52L52-52 M-28-67L28 67 M-67-28L67 28 M-67 28L67-28 M-28 67L28-67"/></g>
          <circle r="9" fill="#e9b364" stroke="#294b47" stroke-width="3"/>
        </g>
        <g id="grass" fill="none" stroke="#819b72" stroke-width="3" stroke-linecap="round"><path d="M0 0Q-1-15-9-23 M0 0Q5-21 14-28 M0 0Q14-10 20-9"/></g>
      </defs>
      <path fill="url(#sky)" d="M0 0H1000V620H0Z"/>
      <circle cx="787" cy="134" r="55" fill="#efc776"/>
      <circle cx="787" cy="134" r="68" fill="none" stroke="#efc776" opacity=".22"/>
      <g id="clouds" opacity=".85"><use href="#cloud" x="133" y="142"/><use href="#cloud" x="535" y="89" transform="translate(535 89) scale(.7) translate(-535 -89)"/><use href="#cloud" x="926" y="195"/></g>
      <path d="M0 328Q124 283 240 324T460 317T675 313T1000 308V412H0Z" fill="#b8cbbb"/>
      <path d="M0 347Q250 333 500 351T1000 343V461H0Z" fill="url(#sea)"/>
      <g stroke="#edf1de" stroke-width="3" stroke-linecap="round" opacity=".8"><path d="M50 376H138 M190 401H238 M753 369H853 M873 405H964 M610 394H655 M315 367H365"/></g>
      <path d="M0 439Q220 413 452 437T1000 428V620H0Z" fill="#d8dcb3"/>
      <path d="M0 493Q490 475 1000 493V583Q500 564 0 583Z" fill="#eee4c9"/>
      <path d="M0 582Q500 563 1000 582" fill="none" stroke="#c6c89c" stroke-width="2"/>
      <g id="ground"><g stroke="#d0c4a4" stroke-width="3" stroke-linecap="round"><path d="M30 537H82 M254 550H280 M457 530H507 M719 551H754 M938 533H990 M1120 549H1150"/></g><use href="#grass" x="120" y="476"/><use href="#grass" x="865" y="486"/><use href="#grass" x="535" y="603"/><use href="#grass" x="1120" y="476"/></g>
      <ellipse cx="514" cy="516" rx="245" ry="16" fill="#6d7d61" opacity=".13"/>
      <g id="rider">
        <path id="farLeg" fill="none" stroke="#bc7c40" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        <g transform="translate(353 425)"><g id="rearWheel"><use href="#wheel"/></g></g>
        <g transform="translate(669 425)"><g id="frontWheel"><use href="#wheel"/></g></g>
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M353 425L435 314L492 425H353L606 323L492 425 M435 314L606 323 M590 285L669 425" stroke="#294b47" stroke-width="12"/>
          <path d="M353 425L435 314L492 425H353L606 323L492 425 M435 314L606 323 M590 285L669 425" stroke="#6aab94" stroke-width="7"/>
          <path d="M435 314L425 286 M591 286L581 259L610 246L632 250" stroke="#294b47" stroke-width="7"/>
          <path d="M616 248L636 252" stroke="#b98050" stroke-width="10"/>
          <path d="M625 255Q654 285 615 323" stroke="#537168" stroke-width="2"/>
          <path d="M404 284Q423 277 447 283" stroke="#694f40" stroke-width="13"/>
          <path d="M294 375Q347 323 408 373 M613 372Q669 327 725 375" stroke="#edc17d" stroke-width="6"/>
        </g>
        <circle cx="492" cy="425" r="22" fill="#d9d9b7" stroke="#294b47" stroke-width="4"/>
        <g id="crank" stroke="#294b47" stroke-width="6" stroke-linecap="round"><path d="M-30 0H30"/></g>
        <g id="bird">
          <path d="M407 257Q366 256 335 220L392 228L370 201Q419 212 443 243" fill="#f5f4df" stroke="#354e47" stroke-width="3" stroke-linejoin="round"/>
          <path d="M396 220C408 186 456 191 484 201C518 207 522 190 517 156C510 113 531 91 554 102C584 117 568 148 564 169C559 189 574 209 557 243C544 274 511 292 465 292C421 292 387 267 396 220Z" fill="#fffced" stroke="#354e47" stroke-width="3"/>
          <path d="M537 161Q541 187 535 210Q523 233 503 235" fill="none" stroke="#dedfc9" stroke-width="12" stroke-linecap="round"/>
          <path d="M563 134L714 154Q645 170 565 156Z" fill="#e6a94e" stroke="#354e47" stroke-width="3" stroke-linejoin="round"/>
          <path d="M568 157L705 155Q655 205 601 199Q574 193 568 157Z" fill="#f0c878" stroke="#354e47" stroke-width="3"/>
          <path d="M584 166Q622 189 673 167" fill="none" stroke="#d9a254" stroke-width="2"/>
          <circle cx="552" cy="126" r="5" fill="#29433d"/><circle cx="553.5" cy="124.5" r="1.5" fill="#fff"/>
          <path d="M519 108Q513 80 541 78Q564 79 565 106" fill="#508971" stroke="#354e47" stroke-width="3"/>
          <path d="M513 105Q543 100 577 111" fill="none" stroke="#354e47" stroke-width="7" stroke-linecap="round"/>
          <path d="M519 177Q543 187 563 178L563 191Q539 199 520 189Z" fill="#d66f45"/>
          <path id="scarf" d="M523 185Q489 176 463 187L475 198L463 209Q498 205 530 192" fill="#df7e4d" stroke="#b96340" stroke-width="2"/>
          <path d="M427 220Q460 207 488 235Q531 251 610 246Q598 266 571 270L483 265Q448 270 427 244" fill="#e9ecda" stroke="#354e47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M438 238Q460 253 482 251 M448 228Q463 239 478 239" fill="none" stroke="#c2cdb8" stroke-width="3" stroke-linecap="round"/>
        </g>
        <path id="nearLeg" fill="none" stroke="#de9d4f" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        <g id="farFoot"><path d="M-15-3L12-3L22 5H-17Z" fill="#b8793e" stroke="#354e47" stroke-width="2"/><path d="M-17 9H20" stroke="#294b47" stroke-width="5" stroke-linecap="round"/></g>
        <g id="nearFoot"><path d="M-15-3L12-3L22 5H-17Z" fill="#edb35b" stroke="#354e47" stroke-width="2"/><path d="M-17 9H20" stroke="#294b47" stroke-width="5" stroke-linecap="round"/></g>
      </g>
      <g fill="none" stroke="#81998b" stroke-width="3" stroke-linecap="round"><path d="M265 247H303 M248 264H290 M281 280H311"/></g>
      <text x="943" y="585" text-anchor="end" fill="#889577" font-size="11" letter-spacing="3">BON VOYAGE</text>
    </svg>
  </div>
  <footer><p class="caption">把今天交给海风，下一站随心情。<br>纯 SVG 绘制 · 循环骑行动画</p><div class="controls"><label for="speed">骑行速度 <input id="speed" type="range" min="0.4" max="2" step="0.1" value="1"><output id="speedValue" for="speed">1.0×</output></label><button id="toggle" type="button" aria-pressed="false">暂停骑行</button></div></footer>
</main>
<script>
  const elements = Object.fromEntries(['rearWheel', 'frontWheel', 'crank', 'bird', 'rider', 'nearLeg', 'farLeg', 'nearFoot', 'farFoot', 'clouds', 'ground', 'scarf'].map(id => [id, document.getElementById(id)]));
  const speed = document.getElementById('speed');
  const toggle = document.getElementById('toggle');
  let playing = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  let time = 0;
  let previous;
  function syncButton() {
    toggle.textContent = playing ? '暂停骑行' : '继续骑行';
    toggle.setAttribute('aria-pressed', String(!playing));
  }
  toggle.addEventListener('click', () => { playing = !playing; syncButton(); });
  speed.addEventListener('input', () => { document.getElementById('speedValue').value = Number(speed.value).toFixed(1) + '×'; });
  function draw() {
    const phase = time * Math.PI * 2 / 1.45;
    const bob = Math.sin(phase * 2) * 2;
    elements.rider.setAttribute('transform', `translate(0 ${Math.sin(phase * 2) * 0.8})`);
    elements.bird.setAttribute('transform', `translate(0 ${bob})`);
    elements.scarf.setAttribute('transform', `rotate(${Math.sin(phase * 2) * 5} 525 188)`);
    for (const name of ['rearWheel', 'frontWheel']) elements[name].setAttribute('transform', `rotate(${phase * 180 / Math.PI})`);
    elements.crank.setAttribute('transform', `translate(492 425) rotate(${phase * 180 / Math.PI})`);
    for (const [side, angle] of [['near', phase], ['far', phase + Math.PI]]) {
      const x = 492 + Math.cos(angle) * 30;
      const y = 425 + Math.sin(angle) * 30;
      const hipX = side === 'near' ? 468 : 449;
      const hipY = 280 + bob;
      const dx = x - hipX;
      const dy = y - hipY;
      const distance = Math.hypot(dx, dy);
      const bend = Math.sqrt(94 * 94 - distance * distance / 4);
      const kneeX = (hipX + x) / 2 + dy / distance * bend;
      const kneeY = (hipY + y) / 2 - dx / distance * bend;
      elements[side + 'Leg'].setAttribute('d', `M${hipX} ${hipY}L${kneeX} ${kneeY}L${x} ${y - 8}`);
      elements[side + 'Foot'].setAttribute('transform', `translate(${x} ${y - 8})`);
    }
    elements.ground.setAttribute('transform', `translate(${-time * 95 % 1000} 0)`);
    elements.clouds.setAttribute('transform', `translate(${-time * 9 % 1100} 0)`);
  }
  const groundCopy = elements.ground.cloneNode(true);
  groundCopy.removeAttribute('id');
  groundCopy.setAttribute('transform', 'translate(1000 0)');
  elements.ground.appendChild(groundCopy);
  const cloudCopy = elements.clouds.cloneNode(true);
  cloudCopy.removeAttribute('id');
  cloudCopy.setAttribute('transform', 'translate(1100 0)');
  elements.clouds.appendChild(cloudCopy);
  function frame(now) {
    if (previous !== undefined && playing) time += Math.min((now - previous) / 1000, 0.05) * Number(speed.value);
    previous = now;
    draw();
    requestAnimationFrame(frame);
  }
  syncButton();
  requestAnimationFrame(frame);
</script>
</body>
</html>
